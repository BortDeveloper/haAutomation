name: CI Smoke Build

on:
  pull_request:
  push:
    branches: [main]
  # G2.17 Operator-Pflicht-Run (Muster ccu2mqtt): manueller Lauf gegen
  # main via `gh workflow run "CI Smoke Build" -r main`; Beleg in
  # audit-log/<YYYY-MM-DD>-operator-pflicht-run.md.
  workflow_dispatch:

# Minimaler Default-Permission-Satz (SLSA Build L3 / GitHub
# Security Hardening Guide). Jobs eskalieren bei Bedarf lokal.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-build:
    name: Smoke Build + Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: home-inventory
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # GITHUB_TOKEN nicht im Working-Tree behalten —
          # Folge-Steps und transitive Actions sehen es sonst.
          persist-credentials: false
      - name: Install Rust toolchain (stable; pinned to 1.75 via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master (Dependabot-Bump 2026-07-20, stable profile)
        with:
          toolchain: stable
      - name: Install sops + age
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          SOPS_VERSION="3.13.1"
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          age --version
          sops --version
      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: home-inventory
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked
